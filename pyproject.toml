[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loadbalancer"
version = "0.1.0"
description = "An L7 HTTP reverse proxy / load balancer from scratch: round-robin/weighted/least-conn/ip-hash, active health checks, circuit breaking, retries"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vishwanathan Tamizharasan" }]
keywords = ["load-balancer", "reverse-proxy", "http", "networking", "asyncio", "health-check", "circuit-breaker"]

[project.scripts]
pylb = "loadbalancer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["loadbalancer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
